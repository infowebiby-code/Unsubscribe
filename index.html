<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unsubscribe - NINe Media Solutions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white max-w-md w-full p-6 rounded-xl shadow-md border border-slate-200" text-center>
    <h2 class="text-xl font-bold text-slate-800">Unsubscribe from Marketing Emails</h2>
    <p class="text-sm text-slate-500 mt-1">We're sorry to see you go. Please confirm your email below.</p>

    <form id="unsubForm" class="mt-6 text-left space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">Email Address</label>
        <input type="email" id="email" required class="mt-1 w-full p-2.5 border rounded-lg border-slate-300 focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="your@email.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700">Reason for leaving</label>
        <select id="reason" class="mt-1 w-full p-2.5 border rounded-lg border-slate-300 text-sm">
          <option>I receive too many emails</option>
          <option>The content is not relevant to me</option>
          <option>I never signed up for this list</option>
          <option>Other</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded-lg text-sm transition">Confirm Unsubscribe</button>
    </form>

    <div id="statusMessage" class="hidden mt-4 p-3 rounded-lg text-sm text-center"></div>
  </div>

  <script>
    // Auto-populate email if passed via URL parameter (?email=user@example.com)
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('email')) {
      document.getElementById('email').value = urlParams.get('email');
    }

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWbg5SJ6cJi6q5PUsRtxBzVZARnZP-2OhYqWQ3-1nv-XIdYcCvRsIFzOfT-t_vGTT7/exec';

    document.getElementById('unsubForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('statusMessage');
      btn.innerText = 'Processing...';
      btn.disabled = true;

      const payload = {
        email: document.getElementById('email').value,
        reason: document.getElementById('reason').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        msg.className = 'mt-4 p-3 rounded-lg text-sm text-center bg-green-50 text-green-700 border border-green-200';
        msg.innerText = 'You have been successfully unsubscribed.';
        msg.classList.remove('hidden');
        document.getElementById('unsubForm').reset();
      } catch (err) {
        msg.className = 'mt-4 p-3 rounded-lg text-sm text-center bg-red-50 text-red-700 border border-red-200';
        msg.innerText = 'An error occurred. Please try again.';
        msg.classList.remove('hidden');
      } finally {
        btn.innerText = 'Confirm Unsubscribe';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
